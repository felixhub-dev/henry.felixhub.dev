<div class="project glass" id="project-{{id}}">
    <img class="project-image {{icon_hidden}}" id="project-{{id}}-icon" src="{{icon}}" alt="{{name}} icon" />
    <div class="project-info">
        <a href="{{url}}" class="project-main-link"><h2 class="project-title">{{name}}</h2></a>
        <p class="project-description">{{description}}</p>
    </div>
    <div class="project-links">
        <!--Buttons-->
        <a href="{{discord}}" class="project-link glass logo {{discord_hidden}}" id="discord-container" target="_blank" rel="noopener noreferrer"><img class="contact-logo" src="/images/icons/discord.svg" alt="Discord" id="discord-logo"/></a>
        <a href="{{github}}" class="project-link glass logo {{github_hidden}}" id="github-container" target="_blank" rel="noopener noreferrer"><img class="contact-logo" src="/images/icons/github.svg" alt="GitHub" id="github-logo"/></a>
    </div>
</div>
